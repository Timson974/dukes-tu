<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DukesTU — Talking Photo</title>
<meta name="theme-color" content="#0a0c14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root {
  --bg: #0a0c14; --surface: #13151f; --surface2: #1a1d2e;
  --border: #252840; --accent: #6366f1; --accent2: #a78bfa;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --green: #10b981; --red: #ef4444; --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100dvh; display: flex; flex-direction: column; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 56px;
  background: rgba(10,12,20,.95); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-logo { font-size: 18px; font-weight: 700; }
.nav-logo span { color: var(--accent2); }
.nav-badge { font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }

main { margin-top: 56px; flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px 16px 48px; gap: 16px; }

.upload-grid { width: 100%; max-width: 480px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.upload-card {
  background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 20px 12px; text-align: center; cursor: pointer; transition: border-color .2s;
  position: relative;
}
.upload-card:hover, .upload-card.ok { border-color: var(--accent); border-style: solid; background: rgba(99,102,241,.08); }
.upload-card input { display: none; }
.upload-card .ico { font-size: 30px; margin-bottom: 6px; }
.upload-card .lbl { font-size: 13px; font-weight: 600; }
.upload-card .hint { font-size: 11px; color: var(--text3); margin-top: 2px; }
.check { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; background: var(--green); display: none; align-items: center; justify-content: center; font-size: 10px; }
.upload-card.ok .check { display: flex; }

.song-row { width: 100%; max-width: 480px; }
.song-label { font-size: 11px; color: var(--text3); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface2); font-size: 13px; color: var(--text2); cursor: pointer; transition: all .15s; }
.chip:hover, .chip.on { border-color: var(--accent); color: var(--accent2); background: rgba(99,102,241,.1); }

.stage-wrap { width: 100%; max-width: 480px; }
.stage { width: 100%; aspect-ratio: 3/4; border-radius: var(--radius); overflow: hidden; background: #000; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
#cvs { position: absolute; inset: 0; width: 100%; height: 100%; }
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text3); font-size: 14px; }
.ph .big { font-size: 52px; }
.ph.gone { display: none; }

.vis { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
.vb { width: 4px; border-radius: 2px; background: var(--accent2); height: 4px; }

.controls { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
.mood { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
.mood-ico { font-size: 20px; }
.btn-row { display: flex; gap: 10px; }
.btn { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover:not(:disabled) { background: var(--surface); border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { opacity: .85; }
.btn.stop { background: var(--red); border-color: var(--red); color: #fff; }
.btn.save { background: var(--green); border-color: var(--green); color: #fff; }
.btn.save.recording { animation: pulse-rec 1s ease-in-out infinite; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
@keyframes pulse-rec { 0%,100%{ opacity:1; } 50%{ opacity:.6; } }

footer { text-align: center; padding: 16px; font-size: 12px; color: var(--text3); border-top: 1px solid var(--border); }
footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
<nav>
  <div class="nav-logo">Dukes<span>TU</span></div>
  <div class="nav-badge">Talking Photo</div>
</nav>

<main>
  <div class="upload-grid">
    <div class="upload-card" id="photoCard" onclick="document.getElementById('photoIn').click()">
      <div class="check">✓</div>
      <div class="ico">🖼️</div>
      <div class="lbl">Photo</div>
      <div class="hint">Portrait works best</div>
      <input type="file" id="photoIn" accept="image/*">
    </div>
    <div class="upload-card" id="audioCard" onclick="document.getElementById('audioIn').click()">
      <div class="check">✓</div>
      <div class="ico">🎵</div>
      <div class="lbl">Your Music</div>
      <div class="hint">MP3, WAV, M4A</div>
      <input type="file" id="audioIn" accept="audio/*">
    </div>
  </div>

  <div class="song-row">
    <div class="song-label">Or pick a preset beat</div>
    <div class="chips">
      <div class="chip" data-s="hiphop">🎤 Hip-hop</div>
      <div class="chip" data-s="pop">💃 Pop</div>
      <div class="chip" data-s="chill">🌙 Chill</div>
      <div class="chip" data-s="epic">🔥 Epic</div>
    </div>
  </div>

  <div class="stage-wrap">
    <div class="stage">
      <canvas id="cvs"></canvas>
      <div class="ph" id="ph"><div class="big">👤</div><span>Upload a photo to start</span></div>
    </div>
  </div>

  <div class="controls">
    <div class="mood">
      <span class="mood-ico" id="mIco">😐</span>
      <span id="mTxt">Waiting for music…</span>
      <div class="vis" id="vis" style="margin-left:auto">
        <div class="vb"></div><div class="vb"></div><div class="vb"></div>
        <div class="vb"></div><div class="vb"></div><div class="vb"></div>
        <div class="vb"></div><div class="vb"></div><div class="vb"></div>
        <div class="vb"></div><div class="vb"></div><div class="vb"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="btnPlay" disabled>▶ Play</button>
      <button class="btn stop"    id="btnStop" disabled>■ Stop</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="btnNew">📂 New Photo</button>
      <button class="btn save" id="btnSave" disabled>💾 Save Video</button>
    </div>
    <div id="mouthRow" style="display:none; flex-direction:column; gap:6px;">
      <!-- Preset buttons -->
      <div style="display:flex;gap:6px;">
        <button class="btn" id="presetSelfie"   style="flex:1;padding:7px;font-size:11px;">🤳 Selfie</button>
        <button class="btn" id="presetPortrait" style="flex:1;padding:7px;font-size:11px;">🖼 Portrait</button>
        <button class="btn" id="presetFull"     style="flex:1;padding:7px;font-size:11px;">🧍 Full</button>
      </div>
      <!-- Two-column grid: left=mouth, right=eyes -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;align-items:center;">
        <!-- MOUTH column header -->
        <div style="font-size:11px;font-weight:600;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em;">👄 Mouth</div>
        <!-- EYE column header -->
        <div style="font-size:11px;font-weight:600;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em;">👁 Eyes</div>

        <!-- Mouth: Vertical -->
        <div>
          <div style="font-size:11px;color:var(--text3)">↕ Y <span id="mouthVal">55</span>%</div>

          <input type="range" id="mouthSlider" min="10" max="95" value="55" style="width:100%;accent-color:var(--accent)">
        </div>
        <!-- Eye: Vertical -->
        <div>
          <div style="font-size:11px;color:var(--text3)">↑ Above mouth <span id="eyeYVal">6</span></div>
          <input type="range" id="eyeYSlider" min="1" max="20" value="6" style="width:100%;accent-color:var(--accent)">
        </div>

        <!-- Mouth: Horizontal -->
        <div>
          <div style="font-size:11px;color:var(--text3)">↔ X <span id="mouthXVal">50</span>%</div>
          <input type="range" id="mouthXSlider" min="20" max="80" value="50" style="width:100%;accent-color:var(--accent2)">
        </div>
        <!-- Eye: Horizontal -->
        <div>
          <div style="font-size:11px;color:var(--text3)">↔ X <span id="eyeXVal">50%</span></div>
          <input type="range" id="eyeXSlider" min="20" max="80" value="50" style="width:100%;accent-color:var(--accent2)">
        </div>

        <!-- Mouth: Size -->
        <div>
          <div style="font-size:11px;color:var(--text3)">⊙ Size <span id="mouthSizeVal">5</span></div>
          <input type="range" id="mouthSizeSlider" min="1" max="10" value="5" style="width:100%;accent-color:var(--green)">
        </div>
        <!-- Eye: Size -->
        <div>
          <div style="font-size:11px;color:var(--text3)">⊙ Size <span id="eyeSizeVal">3</span></div>
          <input type="range" id="eyeSizeSlider" min="1" max="12" value="3" style="width:100%;accent-color:var(--green)">
        </div>

        <!-- (empty mouth slot) -->
        <div></div>
        <!-- Eye: Spread -->
        <div>
          <div style="font-size:11px;color:var(--text3)">↔↔ Gap <span id="eyeSpreadVal2">5</span></div>
          <input type="range" id="eyeSpreadSlider2" min="1" max="12" value="5" style="width:100%;accent-color:var(--accent2)">
        </div>
      </div>
      <!-- hidden legacy sliders -->
      <input type="range" id="eyeOffsetSlider" min="1" max="40" value="8" step="1" style="display:none">
      <input type="range" id="eyeSpreadSlider" min="40" max="200" value="75" step="5" style="display:none">
      <span id="eyeOffsetVal" style="display:none">8</span>
      <span id="eyeSpreadVal" style="display:none">75</span>
    </div>
  </div>
</main>
<footer>DukesTU · <a href="https://timson974.netlify.app">Portfolio</a></footer>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

// ── ELEMENTS
const photoIn  = document.getElementById('photoIn');
const audioIn  = document.getElementById('audioIn');
const photoCard= document.getElementById('photoCard');
const audioCard= document.getElementById('audioCard');
const cvs      = document.getElementById('cvs');
const ctx      = cvs.getContext('2d');
const ph       = document.getElementById('ph');
const vis      = document.getElementById('vis');
const bars     = [...vis.querySelectorAll('.vb')];
const btnPlay  = document.getElementById('btnPlay');
const btnStop  = document.getElementById('btnStop');
const btnNew   = document.getElementById('btnNew');
const btnSave  = document.getElementById('btnSave');
const mIco     = document.getElementById('mIco');
const mTxt     = document.getElementById('mTxt');

// ── STATE
let img = null;           // HTMLImageElement
let audioCtx, analyser, source;
let audioBuffer = null;
let song = null;          // preset name
let playing = false;
let raf = null;

// ── RECORDING STATE
let mediaRecorder = null;
let recChunks = [];
let isRecording = false;

// drawn image bounds (cover fit)
let iX, iY, iW, iH;

// animation state
let hx = 0, hy = 0, thx = 0, thy = 0;  // head offset
let mouth = 0, tmouth = 0;              // mouth open (px)
let t = 0;

// mouth position in CANVAS coords (set when photo loads)
let mouthCX = 0, mouthCY = 0, mouthRX = 0;

// ── PHOTO LOAD
photoIn.addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  const image = new Image();
  image.onload = () => {
    img = image;
    photoCard.classList.add('ok');
    ph.classList.add('gone');
    resizeCvs();
    drawStatic();
    checkReady();
    document.getElementById('mouthRow').style.display = 'flex';
  };
  image.src = url;
});

function resizeCvs() {
  const stage = cvs.parentElement;
  cvs.width  = stage.clientWidth  || 360;
  cvs.height = stage.clientHeight || 480;
  if (!img) return;
  // Cover fit
  const s = Math.max(cvs.width / img.width, cvs.height / img.height);
  iW = img.width  * s;
  iH = img.height * s;
  iX = (cvs.width  - iW) / 2;
  iY = (cvs.height - iH) / 2;
  // Mouth: position from sliders
  const pctY = (document.getElementById('mouthSlider')?.value    || 72) / 100;
  const pctX = (document.getElementById('mouthXSlider')?.value   || 50) / 100;
  const size = (document.getElementById('mouthSizeSlider')?.value || 5)  / 5; // 0.2–2.0
  mouthCX = cvs.width  * pctX;
  mouthCY = cvs.height * pctY;
  // Radius: base scales with vertical position (smaller for full body), then user size
  mouthRX = cvs.width * 0.038 * (0.4 + pctY * 0.6) * size;
}

function drawStatic() {
  if (!img) return;
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.drawImage(img, iX, iY, iW, iH);
  // Show mouth target cross so user can see where to tap
  const pctY = parseFloat(document.getElementById('mouthSlider')?.value || 72) / 100;
  const pctX = parseFloat(document.getElementById('mouthXSlider')?.value || 50) / 100;
  const cx = cvs.width * pctX, cy = cvs.height * pctY;
  const r = 14;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,80,80,0.9)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx-r,cy); ctx.lineTo(cx+r,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx,cy+r); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r*0.4, 0, Math.PI*2); ctx.stroke();
  ctx.restore();
}

window.addEventListener('resize', () => { if (img) { resizeCvs(); if (!playing) drawStatic(); } });

// ── AUDIO FILE
audioIn.addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  ensureAudioCtx();
  const buf = await f.arrayBuffer();
  audioBuffer = await audioCtx.decodeAudioData(buf);
  audioCard.classList.add('ok');
  song = null;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  checkReady();
  mIco.textContent = '🎵'; mTxt.textContent = 'Music ready!';
});

// ── SONG CHIPS
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    chip.classList.add('on');
    song = chip.dataset.s;
    audioBuffer = null;
    audioCard.classList.add('ok');
    checkReady();
    const moods = { hiphop:['😤','Hip-hop beat'], pop:['😄','Pop vibes'], chill:['😌','Chill mode'], epic:['🔥','Epic energy'] };
    const m = moods[song];
    mIco.textContent = m[0]; mTxt.textContent = m[1];
  });
});

function checkReady() {
  const ready = !!(img && (audioBuffer || song));
  btnPlay.disabled = !ready;
  btnSave.disabled = !ready;
}

// ── AUDIO CTX
function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

// ── PLAY
btnPlay.addEventListener('click', async () => {
  ensureAudioCtx();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.connect(audioCtx.destination);

  if (audioBuffer) {
    source = audioCtx.createBufferSource();
    source.buffer = audioBuffer;
    source.connect(analyser);
    source.start(0);
    source.onended = stopAnim;
  } else {
    // Generate beat in Web Audio API — real sound!
    startBeat(song);
  }

  playing = true;
  btnPlay.disabled = true;
  btnStop.disabled = false;
  t = 0; hx = 0; hy = 0; mouth = 0;
  loop();
});

btnStop.addEventListener('click', stopAnim);
btnNew.addEventListener('click',  reset);
btnSave.addEventListener('click', toggleRecord);

// ── RECORD / SAVE VIDEO
function toggleRecord() {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
}

function startRecording() {
  recChunks = [];
  // Capture the canvas stream at 30 fps
  const stream = cvs.captureStream(30);

  // Pick best supported codec
  const mimeType = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4']
    .find(t => MediaRecorder.isTypeSupported(t)) || '';

  try {
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});
  } catch(e) {
    alert('Recording not supported on this browser 😕');
    return;
  }

  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
  mediaRecorder.onstop = saveBlob;

  // Auto-start animation if not already playing
  if (!playing) btnPlay.click();

  mediaRecorder.start(100); // collect chunks every 100ms
  isRecording = true;
  btnSave.textContent = '⏹ Stop & Save';
  btnSave.classList.add('recording');
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  btnSave.textContent = '💾 Save Video';
  btnSave.classList.remove('recording');
}

function saveBlob() {
  const ext = (mediaRecorder?.mimeType || '').includes('mp4') ? 'mp4' : 'webm';
  const blob = new Blob(recChunks, { type: mediaRecorder?.mimeType || 'video/webm' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `dukestu-${Date.now()}.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function stopAnim() {
  if (isRecording) stopRecording();
  playing = false;
  cancelAnimationFrame(raf);
  if (source) { try { source.stop(); } catch(e){} source = null; }
  beatNodes.forEach(n => { try { n.stop(); } catch(e){} });
  beatNodes = [];
  btnPlay.disabled = false;
  btnStop.disabled = true;
  bars.forEach(b => b.style.height = '4px');
  mIco.textContent = '😐'; mTxt.textContent = 'Waiting for music…';
  drawStatic();
}

function reset() {
  stopAnim();
  img = null; audioBuffer = null; song = null;
  photoCard.classList.remove('ok');
  audioCard.classList.remove('ok');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  ph.classList.remove('gone');
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  photoIn.value = ''; audioIn.value = '';
  btnPlay.disabled = true;
}

// ── BEAT GENERATOR (Web Audio synth per genre)
let beatNodes = [];
function startBeat(genre) {
  beatNodes.forEach(n => { try { n.stop(); } catch(e){} });
  beatNodes = [];

  const bpm  = { hiphop:88, pop:120, chill:75, epic:140 }[genre] || 100;
  const beat = 60 / bpm;
  const ctx2 = audioCtx;
  const master = ctx2.createGain(); master.gain.value = 0.55;
  master.connect(analyser);
  source = master; // so stopAnim can disconnect

  function kick(time) {
    const osc = ctx2.createOscillator();
    const g   = ctx2.createGain();
    osc.frequency.setValueAtTime(150, time);
    osc.frequency.exponentialRampToValueAtTime(40, time + 0.1);
    g.gain.setValueAtTime(1, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
    osc.connect(g); g.connect(master);
    osc.start(time); osc.stop(time + 0.3);
  }

  function snare(time) {
    const buf  = ctx2.createBuffer(1, ctx2.sampleRate * 0.15, ctx2.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 2);
    const src2 = ctx2.createBufferSource();
    const g    = ctx2.createGain();
    src2.buffer = buf;
    g.gain.setValueAtTime(0.6, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
    src2.connect(g); g.connect(master);
    src2.start(time);
    beatNodes.push(src2);
  }

  function hihat(time, vol=0.25) {
    const buf  = ctx2.createBuffer(1, ctx2.sampleRate * 0.05, ctx2.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 3);
    const src2 = ctx2.createBufferSource();
    const filt = ctx2.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=8000;
    const g    = ctx2.createGain();
    src2.buffer = buf;
    g.gain.setValueAtTime(vol, time);
    src2.connect(filt); filt.connect(g); g.connect(master);
    src2.start(time);
    beatNodes.push(src2);
  }

  function bass(time, freq, dur) {
    const osc = ctx2.createOscillator();
    const g   = ctx2.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.4, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + dur);
    osc.connect(g); g.connect(master);
    osc.start(time); osc.stop(time + dur + 0.05);
    beatNodes.push(osc);
  }

  // Schedule 8 bars and loop
  function scheduleBars(startTime) {
    const bars = 8;
    const barLen = beat * 4;
    for (let bar = 0; bar < bars; bar++) {
      const bt = startTime + bar * barLen;
      if (genre === 'hiphop') {
        kick(bt); kick(bt + beat*2.5);
        snare(bt + beat); snare(bt + beat*3);
        for (let s = 0; s < 8; s++) hihat(bt + s*beat*0.5, 0.18);
        bass(bt, 55, beat*1.8); bass(bt+beat*2, 55, beat*0.8); bass(bt+beat*3, 41, beat*0.9);
      } else if (genre === 'pop') {
        kick(bt); kick(bt+beat); kick(bt+beat*2); kick(bt+beat*3);
        snare(bt+beat); snare(bt+beat*3);
        for (let s = 0; s < 8; s++) hihat(bt + s*beat*0.5, 0.2);
        bass(bt, 65, beat*0.9); bass(bt+beat*2, 65, beat*0.9);
      } else if (genre === 'chill') {
        kick(bt); kick(bt+beat*2+beat*0.5);
        snare(bt+beat*2);
        for (let s = 0; s < 4; s++) hihat(bt + s*beat + beat*0.75, 0.12);
        bass(bt, 49, beat*1.5); bass(bt+beat*2.5, 44, beat*1.2);
      } else { // epic
        kick(bt); kick(bt+beat*0.5); kick(bt+beat*2); kick(bt+beat*2.5);
        snare(bt+beat); snare(bt+beat*3);
        for (let s = 0; s < 16; s++) hihat(bt + s*beat*0.25, 0.15);
        bass(bt, 55, beat*0.6); bass(bt+beat, 55, beat*0.6); bass(bt+beat*2, 41, beat*0.6); bass(bt+beat*3, 49, beat*0.6);
      }
    }
    // Loop
    const loopAt = startTime + bars * barLen - 0.1;
    const delay = (loopAt - ctx2.currentTime) * 1000;
    if (delay > 0) setTimeout(() => { if (playing) scheduleBars(loopAt); }, delay);
  }

  scheduleBars(ctx2.currentTime + 0.05);
}

// ── ANIMATION LOOP
const freqData = new Uint8Array(128);

function loop() {
  if (!playing) return;
  raf = requestAnimationFrame(loop);
  t += 0.016;

  // Audio energy
  if (analyser) analyser.getByteFrequencyData(freqData);
  const bass = avg(0, 4);
  const mid  = avg(4, 20);
  let energy = audioBuffer ? (bass + mid) / 255 : proceduralE(t, song);

  // Visualiser bars
  bars.forEach((b, i) => {
    const v = audioBuffer ? freqData[i * 2] / 255 : Math.abs(Math.sin(t * tempo(song) + i * 0.5)) * energy;
    b.style.height = (4 + v * 26) + 'px';
  });

  // Head motion — natural sway (wider arc for realistic head turn)
  thx = Math.sin(t * 0.9)  * 5 * energy + Math.sin(t * 1.7) * 2;
  thy = Math.sin(t * 0.6)  * 2 * energy;
  hx += (thx - hx) * 0.07;
  hy += (thy - hy) * 0.07;

  // Mouth open — stronger
  tmouth = energy * 10;  // less extreme opening
  mouth += (tmouth - mouth) * 0.22;

  // Blink
  blinkT += 0.016;
  let blinkClose = 0;
  if (blinkT >= nextBlink) {
    const phase = blinkT - nextBlink;
    if (phase < 0.08) blinkClose = phase / 0.08;
    else if (phase < 0.15) blinkClose = 1;
    else if (phase < 0.23) blinkClose = 1 - (phase - 0.15) / 0.08;
    else { blinkClose = 0; blinkT = 0; nextBlink = 2 + Math.random() * 5; }
  }

  // Draw
  draw(hx, hy, mouth, energy, blinkClose);
  updateMood(energy);
}

function avg(s, e) {
  let sum = 0;
  for (let i = s; i < e && i < freqData.length; i++) sum += freqData[i];
  return sum / (e - s);
}

function proceduralE(t, s) {
  const b = { hiphop:2.8, pop:2.4, chill:1.4, epic:3.2 }[s] || 2;
  return Math.abs(Math.sin(t * b)) * 0.7 + Math.abs(Math.sin(t * b * 2)) * 0.3;
}

function tempo(s) { return { hiphop:2.8, pop:2.4, chill:1.4, epic:3.2 }[s] || 2; }

// ── DRAW FRAME
function draw(dx, dy, mo, energy, blinkClose = 0) {
  const W = cvs.width, H = cvs.height;
  ctx.clearRect(0, 0, W, H);

  // Shared sway transform
  const pivX  = W * 0.5;
  const pivY  = H * 1.4;
  const tilt  = dx * 0.006;      // ±~5° at full sway
  const pScl  = 1 + energy * 0.004;
  const cosT  = Math.cos(tilt);
  const sinT  = Math.sin(tilt);

  // Helper: transform a canvas point (bx,by) through the person's motion
  function xform(bx, by) {
    const rx = bx - pivX, ry = by - pivY;
    return {
      x: pivX + (rx*cosT - ry*sinT)*pScl + dx,
      y: pivY + (rx*sinT + ry*cosT)*pScl + dy*0.5
    };
  }

  // 1. BACKGROUND — zoomed 12%, static
  ctx.save();
  ctx.drawImage(img, iX - iW*0.06, iY - iH*0.06, iW*1.12, iH*1.12);
  ctx.restore();

  // 2. PERSON — static, no sway on the photo itself
  ctx.save();
  ctx.drawImage(img, iX, iY, iW, iH);
  ctx.restore();

  // Edge vignette
  const fade = W * 0.16;
  const gL = ctx.createLinearGradient(0,0,fade,0);
  gL.addColorStop(0,'rgba(0,0,0,0.88)'); gL.addColorStop(1,'rgba(0,0,0,0)');
  const gR = ctx.createLinearGradient(W,0,W-fade,0);
  gR.addColorStop(0,'rgba(0,0,0,0.88)'); gR.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = gL; ctx.fillRect(0,0,fade,H);
  ctx.fillStyle = gR; ctx.fillRect(W-fade,0,fade,H);

  // Read sliders every frame
  const pctY      = parseFloat(document.getElementById('mouthSlider').value)     / 100;
  const pctX      = parseFloat(document.getElementById('mouthXSlider').value)    / 100;
  const sizeVal   = parseFloat(document.getElementById('mouthSizeSlider').value);
  const eyeOffPct = parseFloat(document.getElementById('eyeOffsetSlider').value) / 100;

  // size: slider 1–10, map to 0.5–2.0 so minimum is already decent
  const size = 0.5 + (sizeVal - 1) / 9 * 1.5;

  // Mouth centre — no horizontal sway, only slight vertical bounce
  const mCx = W * pctX;
  const mCy = H * pctY + dy * 0.3;
  const mRx = W * 0.022 * size;  // smaller mouth
  // openH unused — opening computed inside mouth block from moN

  // 3. MOUTH — Cupid's bow lips, opens with beat
  if (mRx > 2) {
    ctx.save();
    ctx.translate(mCx, mCy);

    const L   = mRx * 0.3;
    const moN = Math.min(mo / Math.max(mRx * 2, 1), 1.0);
    const op  = moN * L * 1.8;

    // Dark interior when open
    if (op > 1) {
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(0, op*0.3, mRx*0.75, op*0.55 + L*0.2, 0, 0, Math.PI*2);
      ctx.clip();
      ctx.fillStyle = '#0a0202';
      ctx.fillRect(-mRx, -L, mRx*2, op + L*2);
      if (op > L * 0.5) {
        ctx.fillStyle = 'rgba(248,243,230,0.95)';
        ctx.fillRect(-mRx*0.68, -L*0.4, mRx*1.36, Math.min(op*0.4, L));
      }
      ctx.restore();
    }

    // Upper lip — Cupid's bow
    ctx.beginPath();
    ctx.moveTo(-mRx, 0);
    ctx.bezierCurveTo(-mRx*0.6, -L*1.4, -mRx*0.18, -L*1.9, 0, -L*0.9);
    ctx.bezierCurveTo( mRx*0.18, -L*1.9,  mRx*0.6,  -L*1.4, mRx, 0);
    ctx.bezierCurveTo( mRx*0.5,   L*0.5, -mRx*0.5,   L*0.5, -mRx, 0);
    ctx.fillStyle = 'rgba(200,110,100,0.92)';
    ctx.fill();

    // Lower lip
    ctx.beginPath();
    ctx.moveTo(-mRx, 0);
    ctx.bezierCurveTo(-mRx*0.5, op + L*1.6, mRx*0.5, op + L*1.6, mRx, 0);
    ctx.bezierCurveTo( mRx*0.5, L*0.4, -mRx*0.5, L*0.4, -mRx, 0);
    ctx.fillStyle = 'rgba(190,100,90,0.88)';
    ctx.fill();

    ctx.restore();
  }

  // 4. BLINK — always draw eye markers (dim when open, dark when blinking)
  {
    // Eye sliders
    const eyeSizeSliderVal   = parseFloat(document.getElementById('eyeSizeSlider')?.value    || 3);
    const eyeSpreadSliderVal = parseFloat(document.getElementById('eyeSpreadSlider2')?.value  || 5);
    const eyeXPct  = parseFloat(document.getElementById('eyeXSlider')?.value  || pctX * 100) / 100;
    const eyeYOff  = parseFloat(document.getElementById('eyeYSlider')?.value  || 6);
    // Eye center: eyeYOff = slider 1–20, mapped to 3%–25% above mouth
    const eCx  = W * eyeXPct;
    const eCy  = H * pctY - H * (0.03 + eyeYOff * 0.011) + dy * 0.3;
    const eGap = W * (0.015 + eyeSpreadSliderVal * 0.005);  // 1→0.020, 5→0.040, 12→0.075
    const eRx  = W * (0.010 + eyeSizeSliderVal   * 0.004);  // 1→0.014, 3→0.022, 12→0.058
    const eRy  = blinkClose > 0
      ? eRx * 0.9 * blinkClose
      : eRx * 0.55;

    const eOpen = 1 - blinkClose;
    const eH = eRx * 0.62 * eOpen + 0.5;

    function drawEye(cx, cy) {
      ctx.save();
      // clip to eye shape
      ctx.beginPath();
      ctx.ellipse(cx, cy, eRx, Math.max(eH, 0.5), 0, 0, Math.PI*2);
      ctx.clip();

      // white sclera with soft gradient
      const sg = ctx.createRadialGradient(cx, cy - eH*0.1, 0, cx, cy, eRx);
      sg.addColorStop(0, 'rgba(255,253,248,1)');
      sg.addColorStop(1, 'rgba(220,210,200,0.9)');
      ctx.fillStyle = sg;
      ctx.fillRect(cx - eRx, cy - eH, eRx*2, eH*2);

      if (eOpen > 0.25) {
        // iris — warm brown
        const iR = eRx * 0.44 * Math.min(eOpen * 1.2, 1);
        const ig = ctx.createRadialGradient(cx, cy, 0, cx, cy, iR);
        ig.addColorStop(0,   'rgba(60,35,15,1)');
        ig.addColorStop(0.4, 'rgba(100,65,25,1)');
        ig.addColorStop(0.75,'rgba(80,50,20,1)');
        ig.addColorStop(1,   'rgba(40,20,8,1)');
        ctx.fillStyle = ig;
        ctx.beginPath(); ctx.arc(cx, cy, iR, 0, Math.PI*2); ctx.fill();

        // pupil
        const pR = iR * 0.52;
        ctx.fillStyle = 'rgba(10,5,2,0.97)';
        ctx.beginPath(); ctx.arc(cx, cy, pR, 0, Math.PI*2); ctx.fill();

        // catchlight
        ctx.fillStyle = 'rgba(255,255,255,0.82)';
        ctx.beginPath(); ctx.arc(cx - pR*0.35, cy - pR*0.4, pR*0.28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.arc(cx + pR*0.3, cy + pR*0.25, pR*0.14, 0, Math.PI*2); ctx.fill();
      }

      // upper eyelid shadow
      const lidG = ctx.createLinearGradient(cx, cy - eH, cx, cy);
      lidG.addColorStop(0,   'rgba(60,30,15,0.55)');
      lidG.addColorStop(0.4, 'rgba(60,30,15,0.08)');
      lidG.addColorStop(1,   'rgba(60,30,15,0)');
      ctx.fillStyle = lidG;
      ctx.fillRect(cx - eRx, cy - eH, eRx*2, eH*2);

      ctx.restore();

      // eyelid line (lash line)
      ctx.save();
      ctx.strokeStyle = 'rgba(40,20,10,0.75)';
      ctx.lineWidth = eRx * 0.12;
      ctx.beginPath();
      ctx.ellipse(cx, cy, eRx, Math.max(eH, 0.5), 0, Math.PI, Math.PI*2);
      ctx.stroke();
      ctx.restore();
    }

    drawEye(eCx - eGap, eCy);
    drawEye(eCx + eGap, eCy);
    ctx.restore();
  }
}

// Mouth sliders
const mouthSlider     = document.getElementById('mouthSlider');
const mouthXSlider    = document.getElementById('mouthXSlider');
const mouthSizeSlider = document.getElementById('mouthSizeSlider');
const mouthValEl      = document.getElementById('mouthVal');
const mouthXValEl     = document.getElementById('mouthXVal');
const mouthSizeValEl  = document.getElementById('mouthSizeVal');
mouthSlider.addEventListener('input', () => { mouthValEl.textContent = mouthSlider.value; });
mouthXSlider.addEventListener('input', () => { mouthXValEl.textContent = mouthXSlider.value; });
mouthSizeSlider.addEventListener('input', () => { mouthSizeValEl.textContent = mouthSizeSlider.value; });
// Eye sliders
const eyeSizeSliderEl    = document.getElementById('eyeSizeSlider');
const eyeSpreadSlider2El = document.getElementById('eyeSpreadSlider2');
const eyeXSliderEl       = document.getElementById('eyeXSlider');
const eyeYSliderEl       = document.getElementById('eyeYSlider');
const eyeSizeValEl       = document.getElementById('eyeSizeVal');
const eyeSpreadVal2El    = document.getElementById('eyeSpreadVal2');
const eyeXValEl          = document.getElementById('eyeXVal');
const eyeYValEl          = document.getElementById('eyeYVal');
eyeSizeSliderEl.addEventListener('input',    () => { eyeSizeValEl.textContent    = eyeSizeSliderEl.value; });
eyeSpreadSlider2El.addEventListener('input', () => { eyeSpreadVal2El.textContent = eyeSpreadSlider2El.value; });
eyeXSliderEl.addEventListener('input',       () => { eyeXValEl.textContent       = eyeXSliderEl.value + '%'; });
eyeYSliderEl.addEventListener('input',       () => { eyeYValEl.textContent       = eyeYSliderEl.value; });
// Tap/click on canvas → set mouth position from photo coordinates
function placeFromCanvas(clientX, clientY) {
  if (!img.complete || !img.naturalWidth) return;
  const rect = cvs.getBoundingClientRect();
  // fraction 0..1 within displayed canvas
  const fx = (clientX - rect.left)  / rect.width;
  const fy = (clientY - rect.top)   / rect.height;
  // map to slider percent (canvas coords = photo percent directly)
  const pX = Math.round(Math.max(20, Math.min(80, fx * 100)));
  const pY = Math.round(Math.max(10, Math.min(95, fy * 100)));
  mouthSlider.value  = pY; mouthValEl.textContent  = pY;
  mouthXSlider.value = pX; mouthXValEl.textContent = pX;
  if (!playing) drawStatic(); // redraw crosshair immediately
}
cvs.style.cursor = 'crosshair';
cvs.addEventListener('click', e => placeFromCanvas(e.clientX, e.clientY));
cvs.addEventListener('touchend', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  placeFromCanvas(t.clientX, t.clientY);
}, { passive: false });

// Presets — args: mouthY, mouthX, mouthSize, eyeSize, eyeSpread, eyeY, eyeX
function applyPreset(v, x, s, eSize, eSpread, eY, eX) {
  mouthSlider.value = v;    mouthValEl.textContent    = v;
  mouthXSlider.value = x;   mouthXValEl.textContent   = x;
  mouthSizeSlider.value = s; mouthSizeValEl.textContent = s;
  eyeSizeSliderEl.value = eSize;    eyeSizeValEl.textContent    = eSize;
  eyeSpreadSlider2El.value = eSpread; eyeSpreadVal2El.textContent = eSpread;
  eyeYSliderEl.value = eY;  eyeYValEl.textContent = eY;
  eyeXSliderEl.value = eX;  eyeXValEl.textContent = eX + '%';
}
// Selfie: face fills frame, mouth ~72%, eyes close above
document.getElementById('presetSelfie').addEventListener('click',   () => applyPreset(72, 50, 6, 3, 4, 8, 50));
// Portrait: half-body, mouth ~55%
document.getElementById('presetPortrait').addEventListener('click', () => applyPreset(55, 50, 5, 3, 5, 6, 50));
// Full body: small face, mouth ~38%
document.getElementById('presetFull').addEventListener('click',     () => applyPreset(38, 50, 3, 2, 4, 5, 50));

// Blink state
let blinkT = 0, nextBlink = 3 + Math.random() * 4;

function updateMood(e) {
  if (e > 0.65) { mIco.textContent='🔥'; mTxt.textContent='High energy!'; }
  else if (e > 0.35) { mIco.textContent='😄'; mTxt.textContent='Feeling it!'; }
  else if (e > 0.1)  { mIco.textContent='😊'; mTxt.textContent='Vibing…'; }
  else               { mIco.textContent='😌'; mTxt.textContent='Chilling…'; }
}
